kind: ReplicaSet
apiVersion: apps/v1
metadata:
  name: my-replicaset
  namespace: my-namespace
spec:
  replicas: 2
  selector:
    matchLabels:
     app: nginx

  template:
    metadata:
      name: nginx-replica
      labels:
        app: nginx
    
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
  