kind: Deployment
apiVersion: apps/v1
metadata:
  name: my-persistent-deployment
  namespace: my-namespace

spec:
  replicas: 2
  selector:
    matchLabels:
     app: nginx

  template:
    metadata:
      name: nginx-replica
      labels:
        app: nginx
    
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:  
            - containerPort: 80
          volumeMounts:
            - mountPath: /var/www/html
              name: my-volume
      volumes:
        - name: my-volume
          persistentVolumeClaim:
            claimName: my-pvc
  